; CNCDM-001, the Motor Brush drawing machine: the firmware of its board.
; Waveshare General Driver for Robots Rev 1.2, ESP32-WROOM-32UE.
;
; Flash through the Type-C port labelled USB. Not LiDAR: that one is a
; separate UART↔USB bridge for a lidar, not connected to the ESP32.
; Flash only together with the owner (README.md, "Build and flash").

[env:esp32dev]
platform  = espressif32@7.1.2
board     = esp32dev
framework = arduino

; A mask, not a name: the port number changes with the Mac's USB socket.
upload_port   = /dev/cu.usbserial-*
monitor_port  = /dev/cu.usbserial-*
upload_speed  = 115200     ; at 460800 the CP2102N gave "Corrupt data"
monitor_speed = 115200

; SCServo is not in the PlatformIO registry, so its sources are in lib/.
; FastAccelStepper sends the steps through RMT and MCPWM, past loop().
; 1.3.4 since 2026-09-27: in 0.31.8 moveTimed() was "initial and untested"
; and a diagonal pass ran away; since 1.2.8 a slice is queued atomically,
; since 1.3.0 the steps after a change of direction on MCPWM/PCNT are
; right. The version is pinned exactly.
lib_deps =
    gin66/FastAccelStepper @ 1.3.4
